version: "2"
run:
  concurrency: 4
  tests: true
output:
  formats:
    text:
      path: stdout
linters:
  default: none
  enable:
    - asasalint
    - bodyclose
    - canonicalheader
    - contextcheck
    - copyloopvar
    - cyclop
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gocognit
    - gocritic
    - godot
    - gosec
    - govet
    - ineffassign
    - intrange
    - mirror
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 15
      package-average: 5
    errcheck:
      check-type-assertions: true
      check-blank: false
    gocognit:
      min-complexity: 25
    gocritic:
      disabled-checks:
        - ifElseChain
        - hugeParam
        - rangeValCopy
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
    godot:
      scope: declarations
    gosec:
      excludes:
        - G104
        - G304
        - G404
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    nakedret:
      max-func-lines: 20
    nestif:
      min-complexity: 5
    nolintlint:
      require-explanation: true
      require-specific: true
    perfsprint:
      int-conversion: true
      err-error: true
      errorf: true
      sprintf1: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    sloglint:
      kv-only: false
      attr-only: false
      key-naming-case: snake
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
    tagalign:
      align: true
      sort: true
      order:
        - json
        - yaml
        - xml
        - toml
        - mapstructure
        - binding
        - validate
        - gorm
        - db
        - redis
    usestdlibvars:
      http-method: true
      http-status-code: true
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
    usetesting:
      context-background: true
      context-todo: true
      os-setenv: true
      os-temp-dir: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - cyclop
          - dupword
          - errcheck
          - gocognit
          - gocritic
          - gosec
          - musttag
          - nestif
          - perfsprint
          - unparam
          - wrapcheck
        path: _test\.go
      - linters:
          - cyclop
        path: validatex/validatex\.go
        text: normalizeChinaMobilePhone
      - linters:
          - cyclop
          - gocognit
          - nestif
        path: textx/textx\.go
        text: NewTranslator|TranslateRune|Squeeze|nextRuneRange
      - linters:
          - nestif
        path: textx/textx\.go
        text: if last != utf8\.RuneError
      - linters:
          - revive
        path: (random|randomx/randomx)\.go
        text: func RandId should be RandID
      - linters:
          - wrapcheck
        path: (business|strict|validate|validate_parse|random)\.go
      - linters:
          - wrapcheck
        path: (randomx|validatex)/.*\.go
      - linters:
          - all
        path: .*\.gen\.go
      - linters:
          - all
        path: mock_.*\.go
      - linters:
          - all
        path: .*\.pb\.go
      - linters:
          - cyclop
          - gocognit
          - nestif
        path: cmd/.*/main\.go
      - linters:
          - forbidigo
        path: cmd/
        text: fmt.Print
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
